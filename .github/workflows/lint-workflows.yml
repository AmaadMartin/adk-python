name: Lint Workflows

on:
  push:
    branches: [main, v1]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main, v1]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # actionlint is distributed as a single static binary. Pin the version and
      # verify its checksum instead of depending on a third-party action.
      # shellcheck is preinstalled on the ubuntu-latest runner image; actionlint
      # picks it up automatically to validate the shell in `run:` blocks.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --quiet -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color
