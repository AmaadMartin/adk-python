name: Continuous Integration

on:
  push:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'
  pull_request:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  # 1. Code format and linting (Linter)
  lint:
    name: Pre-commit Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # 2. Static type analysis (Mypy Check with Matrix)
  # Compares new changes against the target base branch dynamically to support v1.
  type-check:
    name: Mypy Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Generate Baseline
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # Switch to target base branch to generate baseline
          git checkout origin/$TARGET_BRANCH

          git checkout ${{ github.sha }} -- pyproject.toml

          # Install dependencies for target branch
          uv venv .venv
          source .venv/bin/activate
          uv sync --all-extras

          # mypy exits 0 when clean, 1 when it reports type errors (expected on
          # the baseline) and >= 2 on a fatal, usage or internal error; an OOM
          # kill surfaces as 128+signum. Read that status from an un-piped run:
          # a pipeline reports its LAST command's status (sort, always 0), so
          # piping mypy into grep makes a mypy that died look like a clean run.
          MYPY_STATUS=0
          uv run mypy . > mypy_baseline_raw.txt || MYPY_STATUS=$?
          if [ "$MYPY_STATUS" -gt 1 ]; then
            echo "::error::mypy failed to run on $TARGET_BRANCH (exit $MYPY_STATUS); the baseline is not trustworthy."
            # mypy dumps the diagnostics it had accumulated to stdout before
            # bailing out; its stderr is unredirected and already in the log.
            tail -n 50 mypy_baseline_raw.txt
            exit 1
          fi

          # Filter for errors only, remove line numbers, and sort. Do NOT add
          # 'set -o pipefail' here: grep exits 1 on a clean tree, which would
          # then fail the job.
          grep "error:" mypy_baseline_raw.txt | sed 's/:\([0-9]\+\):/::/g' | sort > baseline_errors.txt

          # mypy only exits 1 when it emitted a non-note message, so an empty
          # error list means the output was not mypy's (e.g. uv failed first).
          if [ "$MYPY_STATUS" -eq 1 ] && [ ! -s baseline_errors.txt ]; then
            echo "::error::mypy exited 1 (errors reported) on $TARGET_BRANCH but no 'error:' lines were captured."
            exit 1
          fi

          echo "Found $(wc -l < baseline_errors.txt) errors on $TARGET_BRANCH."

      - name: Check PR Branch
        run: |
          # Switch back to the PR commit
          git checkout ${{ github.sha }}

          # Re-sync dependencies in case the PR changed them
          source .venv/bin/activate
          uv sync --all-extras

          # Same capture-then-filter treatment as the Generate Baseline step,
          # which explains each guard.
          MYPY_STATUS=0
          uv run mypy . > mypy_pr_raw.txt || MYPY_STATUS=$?
          if [ "$MYPY_STATUS" -gt 1 ]; then
            echo "::error::mypy failed to run on the PR branch (exit $MYPY_STATUS); type checking did not complete."
            tail -n 50 mypy_pr_raw.txt
            exit 1
          fi

          grep "error:" mypy_pr_raw.txt | sed 's/:\([0-9]\+\):/::/g' | sort > pr_errors.txt

          if [ "$MYPY_STATUS" -eq 1 ] && [ ! -s pr_errors.txt ]; then
            echo "::error::mypy exited 1 (errors reported) on the PR branch but no 'error:' lines were captured."
            exit 1
          fi

          echo "Found $(wc -l < pr_errors.txt) errors on PR branch."

      - name: Compare and Fail on New Errors
        run: |
          # The last fail-open signature, and the one no exit-status check can
          # catch because mypy exits 0 legitimately: zero errors on the PR
          # branch against a large baseline means the PR run measured the wrong
          # thing (e.g. the .mypy_cache the baseline run left in the workspace)
          # far more plausibly than that it fixed every pre-existing error.
          # Trade-off: misfires on a PR that genuinely clears the whole
          # baseline. Once the baseline reaches zero the guard is vacuous.
          if [ -s baseline_errors.txt ] && [ ! -s pr_errors.txt ]; then
            echo "::error::mypy reported 0 errors on the PR branch but $(wc -l < baseline_errors.txt) on the base branch. The PR run almost certainly did not type-check anything."
            exit 1
          fi

          # 'comm -13' suppresses unique lines in file1 (baseline) and common lines,
          # leaving only lines unique to file2 (PR) -> The new errors.
          comm -13 baseline_errors.txt pr_errors.txt > new_errors.txt

          if [ -s new_errors.txt ]; then
            echo "::error::The following NEW mypy errors were introduced:"
            cat new_errors.txt
            exit 1
          else
            echo "Great job! No new mypy errors introduced."
          fi

  # 3a. Unit testing (Unit Tests with Matrix)
  unit-test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: Run unit tests with pytest
        run: |
          source .venv/bin/activate
          pytest tests/unittests \
            -n auto \
            --ignore=tests/unittests/artifacts/test_artifact_service.py \
            --ignore=tests/unittests/tools/google_api_tool/test_googleapi_to_openapi_converter.py

  # 3b. Dual-version A2A coverage: This job pins a2a-sdk to 0.3.x and
  # runs only the A2A-related tests, so the a2a/_compat.py shim stays
  # verified against both SDK majors.
  # TODO: Remove this 0.3.x re-run once a2a-sdk 0.3.x support is dropped.
  unit-test-a2a-v0-3:
    name: A2A v0.3 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: Run A2A tests against a2a-sdk v0.3
        run: |
          source .venv/bin/activate
          uv pip install --reinstall-package a2a-sdk 'a2a-sdk>=0.3.4,<0.4'
          pytest tests/unittests/a2a \
            tests/unittests/agents/test_remote_a2a_agent.py \
            tests/unittests/integrations/agent_registry/test_agent_registry.py
