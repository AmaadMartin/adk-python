name: Continuous Integration

on:
  push:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'
  pull_request:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'

permissions:
  contents: read

jobs:
  # 1. Code format and linting (Linter)
  lint:
    name: Pre-commit Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # 2. Static type analysis (Mypy Check with Matrix)
  # Compares new changes against the target base branch dynamically to support v1.
  type-check:
    name: Mypy Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Generate Baseline
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # Switch to target base branch to generate baseline
          git checkout origin/$TARGET_BRANCH

          git checkout ${{ github.sha }} -- pyproject.toml

          # Install dependencies for target branch
          uv venv .venv
          source .venv/bin/activate
          uv sync --all-extras

          # Run mypy, filter for errors only, remove line numbers, and sort
          # We ignore exit code (|| true) because we expect errors on baseline
          uv run mypy . | grep "error:" | sed 's/:\([0-9]\+\):/::/g' | sort > baseline_errors.txt || true
          echo "Found $(wc -l < baseline_errors.txt) errors on $TARGET_BRANCH."

      - name: Check PR Branch
        run: |
          # Switch back to the PR commit
          git checkout ${{ github.sha }}

          # Re-sync dependencies in case the PR changed them
          source .venv/bin/activate
          uv sync --all-extras

          # Run mypy on PR code, apply same processing
          uv run mypy . | grep "error:" | sed 's/:\([0-9]\+\):/::/g' | sort > pr_errors.txt || true
          echo "Found $(wc -l < pr_errors.txt) errors on PR branch."

      - name: Compare and Fail on New Errors
        run: |
          # 'comm -13' suppresses unique lines in file1 (baseline) and common lines,
          # leaving only lines unique to file2 (PR) -> The new errors.
          comm -13 baseline_errors.txt pr_errors.txt > new_errors.txt

          if [ -s new_errors.txt ]; then
            echo "::error::The following NEW mypy errors were introduced:"
            cat new_errors.txt
            exit 1
          else
            echo "Great job! No new mypy errors introduced."
          fi

  # 3a. Unit testing (Unit Tests with Matrix)
  unit-test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: Run unit tests with pytest
        run: |
          source .venv/bin/activate
          pytest tests/unittests \
            -n auto \
            --ignore=tests/unittests/artifacts/test_artifact_service.py \
            --ignore=tests/unittests/tools/google_api_tool/test_googleapi_to_openapi_converter.py

  # 3b. Dual-version A2A coverage: This job pins a2a-sdk to 0.3.x and
  # runs only the A2A-related tests, so the a2a/_compat.py shim stays
  # verified against both SDK majors.
  # TODO: Remove this 0.3.x re-run once a2a-sdk 0.3.x support is dropped.
  unit-test-a2a-v0-3:
    name: A2A v0.3 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: Run A2A tests against a2a-sdk v0.3
        run: |
          source .venv/bin/activate
          uv pip install --reinstall-package a2a-sdk 'a2a-sdk>=0.3.4,<0.4'
          pytest tests/unittests/a2a \
            tests/unittests/agents/test_remote_a2a_agent.py \
            tests/unittests/integrations/agent_registry/test_agent_registry.py

  # 3c. Dependency floor coverage: every other job installs with
  # `uv sync`, which always resolves the NEWEST compatible release, so the
  # lower bounds declared in pyproject.toml are never exercised. This job
  # installs them wholesale -- `--resolution lowest-direct` takes the lowest
  # version each direct requirement admits and the newest for transitives --
  # on the minimum supported Python, then runs the test areas driven by the
  # runtime dependencies against them.
  #
  # `uv pip install` is deliberate, not a stand-in for `uv sync`: uv's lock is
  # universal and covers EVERY extra, so `uv sync --extra test` would also
  # resolve the floors of the docs and dev extras, several of which declare no
  # lower bound and select unbuildable pre-2015 sdists. `uv pip install`
  # resolves only what it installs: the runtime deps plus the test extra.
  #
  # TODO: Drop continue-on-error once the stale floors this job reports have
  # been raised. It is advisory today because several are known to be wrong.
  dependency-floors:
    name: Dependency Floors (lowest-direct, Python 3.10)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install the declared dependency floors
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install --resolution lowest-direct -e ".[test]"

      - name: Report the resolved floors
        run: |
          source .venv/bin/activate
          uv pip freeze

      - name: Run unit tests against the declared floors
        run: |
          source .venv/bin/activate
          pytest -n auto \
            tests/unittests/agents \
            tests/unittests/auth \
            tests/unittests/cli \
            tests/unittests/events \
            tests/unittests/flows \
            tests/unittests/memory \
            tests/unittests/runners \
            tests/unittests/sessions \
            tests/unittests/telemetry \
            tests/unittests/utils \
            tests/unittests/test_import_loading.py \
            tests/unittests/test_optional_dependencies.py \
            tests/unittests/test_release_dependencies.py \
            --ignore=tests/unittests/cli/test_fast_api.py
