name: Continuous Integration

# Keep both `paths` lists in sync. `constraints-*.txt` and the config schema
# directory are here for the agent-config-schema job: without them a pull
# request that only refreshes the pins, or that only hand-edits the generated
# schema, runs no check at all.
on:
  push:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'constraints-*.txt'
      - 'src/google/adk/agents/config_schemas/**'
      - 'tests/**'
  pull_request:
    branches: [main, v1]
    paths:
      - '**.py'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'constraints-*.txt'
      - 'src/google/adk/agents/config_schemas/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  # 1. Code format and linting (Linter)
  lint:
    name: Pre-commit Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Run pre-commit checks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # 2. Static type analysis (Mypy Check with Matrix)
  # Compares new changes against the target base branch dynamically to support v1.
  type-check:
    name: Mypy Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Generate Baseline
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # Switch to target base branch to generate baseline
          git checkout origin/$TARGET_BRANCH

          git checkout ${{ github.sha }} -- pyproject.toml

          # Install dependencies for target branch
          uv venv .venv
          source .venv/bin/activate
          uv sync --all-extras

          # Run mypy, filter for errors only, remove line numbers, and sort
          # We ignore exit code (|| true) because we expect errors on baseline
          uv run mypy . | grep "error:" | sed 's/:\([0-9]\+\):/::/g' | sort > baseline_errors.txt || true
          echo "Found $(wc -l < baseline_errors.txt) errors on $TARGET_BRANCH."

      - name: Check PR Branch
        run: |
          # Switch back to the PR commit
          git checkout ${{ github.sha }}

          # Re-sync dependencies in case the PR changed them
          source .venv/bin/activate
          uv sync --all-extras

          # Run mypy on PR code, apply same processing
          uv run mypy . | grep "error:" | sed 's/:\([0-9]\+\):/::/g' | sort > pr_errors.txt || true
          echo "Found $(wc -l < pr_errors.txt) errors on PR branch."

      - name: Compare and Fail on New Errors
        run: |
          # 'comm -13' suppresses unique lines in file1 (baseline) and common lines,
          # leaving only lines unique to file2 (PR) -> The new errors.
          comm -13 baseline_errors.txt pr_errors.txt > new_errors.txt

          if [ -s new_errors.txt ]; then
            echo "::error::The following NEW mypy errors were introduced:"
            cat new_errors.txt
            exit 1
          else
            echo "Great job! No new mypy errors introduced."
          fi

  # 3a. Unit testing (Unit Tests with Matrix)
  unit-test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: List installed packages
        run: uv pip list

      - name: Run unit tests with pytest
        run: |
          uv run pytest tests/unittests \
            -n auto \
            --ignore=tests/unittests/artifacts/test_artifact_service.py \
            --ignore=tests/unittests/tools/google_api_tool/test_googleapi_to_openapi_converter.py

  # 3b. Dual-version A2A coverage: This job pins a2a-sdk to 0.3.x and
  # runs only the A2A-related tests, so the a2a/_compat.py shim stays
  # verified against both SDK majors.
  # TODO: Remove this 0.3.x re-run once a2a-sdk 0.3.x support is dropped.
  unit-test-a2a-v0-3:
    name: A2A v0.3 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv sync --extra test

      - name: List installed packages (before reinstall)
        run: uv pip list

      - name: Run A2A tests against a2a-sdk v0.3
        run: |
          uv pip install --reinstall-package a2a-sdk 'a2a-sdk>=0.3.4,<0.4'
          uv pip list
          uv run pytest tests/unittests/a2a \
            tests/unittests/agents/test_remote_a2a_agent.py \
            tests/unittests/integrations/agent_registry/test_agent_registry.py

  # 4. Generated schema drift check.
  # src/google/adk/agents/config_schemas/AgentConfig.json is generated from the
  # agent config pydantic models, and is published for editors to fetch. This
  # job regenerates it and fails when the committed copy differs.
  #
  # Every part of the environment below is pinned, because each one changes the
  # generated bytes:
  #   - Python 3.14: on 3.13 and below the generator emits two union fallback
  #     stubs where 3.14 emits one.
  #   - constraints-3.14.txt: the schema inlines google.genai.types, and
  #     pyproject.toml accepts a range of google-genai releases that disagree.
  #   - --all-extras: pillow reaches the environment only through an extra, and
  #     google.genai.types imports it under try/except, so its absence changes
  #     four definitions. It is also the extras set the constraints file was
  #     compiled with, so every pin here applies.
  # Do not replace this with `uv sync`: uv sync takes no --constraint, so the
  # dependency versions would float and the job would fail on unrelated pull
  # requests whenever google-genai publishes.
  #
  # A constraints refresh that moves google-genai therefore fails this job
  # until the schema is regenerated in the same pull request. That coupling is
  # deliberate: it turns silent drift into one deliberate step.
  agent-config-schema:
    name: Agent Config Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # The checkout is installed last and with --no-deps, so it wins over the
      # google-adk release that constraints-3.14.txt pins for the dependants
      # that require google-adk themselves.
      - name: Install the pinned dependency set
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r pyproject.toml \
            --all-extras -c constraints-3.14.txt
          uv pip install --python .venv/bin/python -e . --no-deps

      - name: Regenerate the schema
        run: .venv/bin/python scripts/generate_agent_config_schema.py

      - name: Check the committed schema is up to date
        run: |
          if ! git diff --exit-code \
              -- src/google/adk/agents/config_schemas/AgentConfig.json; then
            echo '::error::AgentConfig.json is out of date. Regenerate it with the commands below and commit the result.'
            echo '  uv venv .venv --python 3.14'
            echo '  uv pip install --python .venv/bin/python -r pyproject.toml --all-extras -c constraints-3.14.txt'
            echo '  uv pip install --python .venv/bin/python -e . --no-deps'
            echo '  .venv/bin/python scripts/generate_agent_config_schema.py'
            exit 1
          fi
