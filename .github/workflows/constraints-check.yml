name: Constraints Check

# Keep both `paths` lists in sync, and keep this file itself in both. The job
# diffs uv's output byte-for-byte, so the pinned uv `version:` below has to be
# bumped together with a regeneration; a pull request touching only this file
# would otherwise run no check at all, and the mismatched pin would surface
# later as a failure on someone else's unrelated pull request.
on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'constraints-*.txt'
      - 'scripts/update_constraints.sh'
      - '.github/workflows/constraints-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'constraints-*.txt'
      - 'scripts/update_constraints.sh'
      - '.github/workflows/constraints-check.yml'

permissions:
  contents: read

jobs:
  constraints-check:
    name: Constraints Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Pinned deliberately: this job is a byte-for-byte diff of uv's
          # output against the committed files, so a resolver or output-format
          # change in a new uv release turns it red without any dependency
          # having drifted. Bump this together with a regeneration
          # (./scripts/update_constraints.sh) in the same commit.
          version: "0.11.8"
          enable-cache: true

      - name: Verify constraints are up to date
        run: ./scripts/update_constraints.sh --check
