version: 2
updates:
  # Keeps the third-party actions used by .github/workflows current. Actions
  # pinned to a commit SHA are rewritten in place, with the trailing "# vN"
  # comment updated to match, so the pins stay immutable and readable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR per week instead of one PR per action: every PR here has
    # to be landed by a maintainer, so volume is the binding constraint.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
